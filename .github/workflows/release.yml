# wazamono-toolchain release workflow (Phase 1)
#
# トリガ: `tools-*` タグのpush（例: tools-15.2.0-wazamono1）
# 生成物:
#   avr-gcc-<ver>-<rev>-x86_64-pc-linux-gnu.tar.gz
#   avr-gcc-<ver>-<rev>-x86_64-mingw32.tar.gz
#   avrdude-<ver>-<rev>-{x86_64-mingw32,x86_64-pc-linux-gnu,aarch64-linux-gnu,
#                        x86_64-apple-darwin,arm64-apple-darwin}.tar.gz
#   checksums.txt / tools-fragment.json
#
# Phase 2で追加予定のジョブ（本ファイル末尾のコメント参照）:
#   build-linux-arm (ubuntu-24.04-arm) / build-macos-intel (macos-13) /
#   build-macos-arm (macos-latest)
name: release

on:
  push:
    tags: ["tools-*"]
  workflow_dispatch: {}   # 手動実行（タグなしテストビルド用、Release作成はスキップ）

jobs:
  build-avr-gcc-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential texinfo flex bison libzstd-dev \
            g++-mingw-w64-x86-64 zip

      - name: Build native (x86_64-pc-linux-gnu)
        run: bash scripts/build-avr-gcc.sh native

      - name: Build canadian cross (x86_64-mingw32)
        run: bash scripts/build-avr-gcc.sh mingw-x64

      - name: Package
        run: |
          bash scripts/package-avr-gcc.sh build/prefix-native    x86_64-pc-linux-gnu
          bash scripts/package-avr-gcc.sh build/prefix-mingw-x64 x86_64-mingw32

      - uses: actions/upload-artifact@v4
        with:
          name: avr-gcc-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  repackage-avrdude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Repackage official avrdude binaries
        run: bash scripts/repackage-avrdude.sh
      - uses: actions/upload-artifact@v4
        with:
          name: avrdude
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [build-avr-gcc-linux, repackage-avrdude]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and index fragment
        run: |
          cd dist && sha256sum *.tar.gz > checksums.txt && cd ..
          python3 scripts/gen-index-fragment.py \
            --url-base "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            > dist/tools-fragment.json
          cat dist/tools-fragment.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/tools-fragment.json
          fail_on_unmatched_files: true
          draft: true          # 内容確認してから手動で公開する運用
          generate_release_notes: false
          body: |
            wazamono-toolchain ${{ github.ref_name }}

            - avr-gcc / binutils / avr-libc: versions.env 参照
            - avrdude: avrdudes/avrdude 公式バイナリの正規化再パッケージ（無改変）
            - tools-fragment.json をパッケージインデックスの tools セクションに転記すること

